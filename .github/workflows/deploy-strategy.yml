name: Strategy Service CI/CD

on:
  push:
    branches: [ "develop" ]

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: pi-strategy
  SERVICE_NAME: planit-strategy-svc
  ENVIRONMENT: dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    outputs:
      failed_stage: ${{ steps.set-failed-stage.outputs.failed_stage }}

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v3

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: 3. Build with Gradle
        id: build
        continue-on-error: true
        run: |
          chmod +x gradlew
          ./gradlew clean build -x test

      - name: 4. Configure AWS credentials
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 5. Login to Amazon ECR
        id: login-ecr
        continue-on-error: true
        uses: aws-actions/amazon-ecr-login@v1

      - name: 6. Build and push Docker image
        id: docker
        continue-on-error: true
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: 7. Checkout Manifest Repository
        continue-on-error: true
        uses: actions/checkout@v3
        with:
          repository: barumi-acs/Planit-manifests
          token: ${{ secrets.GH_PAT }}
          ref: develop
          path: manifest-repo

      - name: 8. Update Image Tag in YAML
        id: manifest
        continue-on-error: true
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          TARGET_FILE="manifest-repo/strategy-svc/deployment.yaml"
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          sed -i "s|image: .*|image: $FULL_IMAGE|g" $TARGET_FILE

      - name: 9. Push Changes to Manifest Repo
        id: push
        continue-on-error: true
        run: |
          cd manifest-repo
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action Bot"
          git add .
          git commit -m "chore(strategy-svc): update image to ${{ github.sha }}" || echo "No changes"
          git push origin develop

      # 🔥 실패 단계 추적
      - name: Set Failed Stage
        id: set-failed-stage
        if: always()
        run: |
          if [ "${{ steps.build.outcome }}" = "failure" ]; then
            echo "failed_stage=build" >> $GITHUB_OUTPUT
          elif [ "${{ steps.login-ecr.outcome }}" = "failure" ]; then
            echo "failed_stage=ecr-login" >> $GITHUB_OUTPUT
          elif [ "${{ steps.docker.outcome }}" = "failure" ]; then
            echo "failed_stage=docker" >> $GITHUB_OUTPUT
          elif [ "${{ steps.manifest.outcome }}" = "failure" ]; then
            echo "failed_stage=deploy" >> $GITHUB_OUTPUT
          elif [ "${{ steps.push.outcome }}" = "failure" ]; then
            echo "failed_stage=git-push" >> $GITHUB_OUTPUT
          else
            echo "failed_stage=none" >> $GITHUB_OUTPUT
          fi


  notify:
    runs-on: ubuntu-latest
    needs: build-and-deploy
    if: always()

    steps:
      - name: Configure AWS for Notification
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Send Notification
        run: |
          STAGE="${{ needs.build-and-deploy.outputs.failed_stage }}"
          WORKFLOW="${{ github.workflow }}"
          AUTHOR="${{ github.actor }}"
          ENVIRONMENT="${{ env.ENVIRONMENT }}"

          if [ "$STAGE" = "none" ]; then
            aws sns publish \
              --region ${{ env.AWS_REGION }} \
              --topic-arn ${{ secrets.SNS_TOPIC_ARN }} \
              --message "{\"status\":\"SUCCESS\",\"workflow\":\"$WORKFLOW\",\"service\":\"${{ env.SERVICE_NAME }}\",\"stage\":\"pipeline\",\"env\":\"$ENVIRONMENT\",\"author\":\"$AUTHOR\"}"
          else
            aws sns publish \
              --region ${{ env.AWS_REGION }} \
              --topic-arn ${{ secrets.SNS_TOPIC_ARN }} \
              --message "{\"status\":\"ERROR\",\"workflow\":\"$WORKFLOW\",\"service\":\"${{ env.SERVICE_NAME }}\",\"stage\":\"$STAGE\",\"env\":\"$ENVIRONMENT\",\"author\":\"$AUTHOR\",\"message\":\"Failed at $STAGE\"}"
          fi